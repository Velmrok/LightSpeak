@if (serversSection.status === 'error') {
<div>error</div>
}
@else if (serversSection.data.length === 0) {
<div>no servers</div>
}
@else {
<div class="server-list">
    @for (server of serversSection.data; track server.id) {
    
        <app-server-avatar [serverSummary]="server"></app-server-avatar>
   
    }
</div>
}
