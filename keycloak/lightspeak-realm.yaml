realm: lightspeak
enabled: true
registrationAllowed: true
loginWithEmailAllowed: true
sslRequired: external

roles:
  realm:
    - name: admin

clients:
  - clientId: light-speak-gateway
    enabled: true
    publicClient: false
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    attributes:
      pkce.code.challenge.method: S256 
      post.logout.redirect.uris: "$(env:APP_BASE_URL)/signout-callback-oidc"
    redirectUris:
      - "$(env:APP_BASE_URL)/signin-oidc"
      - "$(env:APP_BASE_URL)/signout-oidc"
    protocolMappers:
      - name: realm-audience
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.client.audience: lightspeak-frontend
          access.token.claim: "true"
          id.token.claim: "false"
          introspection.token.claim: "true"
          userinfo.token.claim: "false"
      - name: realm-roles
        protocol: openid-connect
        protocolMapper: oidc-usermodel-realm-role-mapper
        config:
          multivalued: "true"
          claim.name: "roles"
          jsonType.label: "String"
          access.token.claim: "true"
          id.token.claim: "true"
          userinfo.token.claim: "true"
    secret: "$(env:KC_FRONTEND_SECRET)"

  - clientId: backend-admin
    enabled:   true
    serviceAccountsEnabled: true
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    secret: "$(env:KC_ADMIN_CLIENT_SECRET)"

components:
  org.keycloak.userprofile.UserProfileProvider:
    - providerId: declarative-user-profile
      config:
        kc.user.profile.config:
          - |
            {
              "attributes": [
                {
                  "name": "username",
                  "permissions": { "view": ["admin", "user"], "edit": ["admin"] },
                  "required": { "roles": ["user"] },
                  "validations": { "length": { "min": 3, "max": 255 }, "username-prohibited-characters": {} }
                },
                {
                  "name": "email",
                  "permissions": { "view": ["admin", "user"], "edit": ["admin"] },
                  "required": { "roles": ["user"] },
                  "validations": { "email": {}, "length": { "max": 255 } }
                }
              ],
              "groups": []
            }